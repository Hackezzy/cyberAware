<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in or create an account to save your CyberAware progress to your account, not just this browser." />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <title>Log In | CyberAware</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("cyberaware:theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="nav-mount"></div>

  <main id="main-content">
    <section class="container page-section" style="max-width: 28rem;">
      <h1 class="page-title">Log In</h1>

      <form id="auth-form" novalidate style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-field">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-input" autocomplete="username" placeholder="at least 3 characters" />
        </div>
        <div class="form-field">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" placeholder="at least 8 characters" />
        </div>

        <p id="auth-error" class="error-text" hidden></p>
        <p id="auth-status" class="form-hint" hidden></p>

        <div class="form-actions">
          <button type="button" id="login-btn" class="btn btn-primary">Log in</button>
          <button type="button" id="register-btn" class="btn btn-secondary">Create account</button>
        </div>
      </form>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="/js/nav.js"></script>
  <script type="module" src="/login.js"></script>
</body>
</html>
